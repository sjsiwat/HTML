<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Register Form </title>

    <style>
        .border-radius-color {
            width: auto;
            height: fit-content;
            background-color: #f3e5e5;
            border: 5px dotted #eb4545;


        }
    </style>


</head>
<body style="display:flexbox; text-align: center;">

    

<h1 style="text-align: center;"> Register form </h1>
<hr color="red" width="50%" align="center" size="2">

<p style="text-align: center;"> Please fill in the blank</p>

<div class="border-radius-color">

<form action="" method="post">

<label for="name">Firstname</label>
<input type="text" name="firstname" id="fname" required placeholder="your first name ">
<br>
<br>
<label for="lastname">Lastname</label>
<input type="text" name="lastname" id="lname" required placeholder="your last name"> 
<br>
<br>
<br>
<p>Create your new username</p>
<label for="username">Username :</label>
<input type="text" name="username" id="userid" required placeholder="choose your user name">



<p>Please enter your new password </p>
<label for="password">Password :</label>
<input type="password" name="userpassword" id="passwordid" required placeholder="your new password">


<p> Your email</p>
<label for="email"> Your Email :</label>
<input type="text" name="email" id="emailid" required placeholder="email@example.com">

<br><br>

<p>Please choose your package for subcription</p>
<label for="freeplan"> Free Plan</label>
<input type="radio" name="freeplan" id="freeplanmode" required>

<label for="premium"> Premium Plan </label>
<input type="radio" name="premiumplan" id="premiummode">

<p> Interesting with </p>
<label for="movies"> Movies</label>
<input type="checkbox" name="movies" id="movies_in">

<label for="music"> Music Listening </label>
<input type="checkbox" name="music" id="music_id">

<label for="game"> Playing Game </label>
<input type="checkbox" name="game" id="game_id">
<br>
<br>
<button type="submit">  SUBMIT !</button>










</form>
</div>

</style>

</body>
</html>
