<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Rista</title>


</head>


<body>

    <h1>Johny is Cat Barista</h1>
    <p>Hi world , Order Here </p>
   
    <form action="" method="post">
    <br>
        <label for="user">Your name</label>
        <input type="text" name="user" id="user" >
    <br>
    <br>    
        <div>would you like to drink? </div>
    <br>    
        <label for="blackcoffee"> Black Coffee</label>
        <input type="radio" name="coffee" id="blackcoffee" required>
        
        <label for="milkcoffee"> Cafe Latte </label>
        <input type="radio" name="coffee" id="milkcoffee">

        <label for="coco"> Chocolate </label>
        <input type="radio" name="noncoffee" id="coco">

    <br>
    <br>
        <p> Add on</p>
        <p> you can add on some syrup or milk or beans upgrade </p>

        <label for="oatmilk"> Change to Oat milk </label>
        <input type="checkbox" name="oatmilk" id="addon">
    <br>
        <label for="syrup"> Add Vanilla syrup</label>
        <input type="checkbox" name="syrub" id="addon">
    <br>
        <label for="upbean"> Beans selection </label>
        <input type="checkbox" name="upbean" id="addon">

    <br>
    <br>
    <button type="submit"> Order Here ! </button>
         



    </form>





</body>
</html>
